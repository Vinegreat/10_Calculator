version: '3.7'

services:     
  mariadb:
    container_name: web-mariadb-10
    hostname: mariadb
    image: mariadb:10.5
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: myWebCalculatorDb
      MARIADB_USER: root
      MARIADB_PASSWORD: password
    ports:
      - "0.0.0.0:5030:3306"
      
  web:
    container_name: web-app-calculator-10
    hostname: app
    build: ./
    ports:
      - "0.0.0.0:5010:5010"
